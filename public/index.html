<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>智慧校园平台 · 登录</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-left">
      <div class="brand"><i></i><span id="brandName">智慧校园平台</span></div>
      <div class="slogan">多租户 · 机构树 · 扫码登录<br /><span>同类架构实现</span></div>
      <div class="feat">
        <div>请求全程 AES-256-CBC 加密 + HMAC 签名 + 时间戳/nonce 防重放</div>
        <div>扫码登录 onceToken 服务端生成、一次性消费、轮询限流</div>
        <div>注册审批流：提交 → 待审 → 管理员批准才建号</div>
        <div>RBAC 页面码 + 按钮码，服务端接口级校验</div>
        <div>机构树按数据域过滤，跨机构读写直接拒绝</div>
      </div>
    </div>

    <div class="login-right">
      <div class="tabs">
        <button id="tab-pwd" class="on">账号登录</button>
        <button id="tab-sms">短信登录</button>
        <button id="tab-qr">扫码登录</button>
      </div>

      <label>租户</label>
      <select id="tenantSel"></select>

      <!-- 账号密码 -->
      <div id="pane-pwd">
        <label>账号</label>
        <input id="userName" placeholder="admin / teacher1" autocomplete="username" />
        <label>密码</label>
        <input id="password" type="password" placeholder="Admin@2026" autocomplete="current-password" />
        <div id="capWrap" style="display:none">
          <label>图形验证码（连续 2 次失败后强制）</label>
          <div class="captcha-row">
            <input id="checkCode" placeholder="4 位字符" />
            <img id="capImg" title="点击刷新" />
          </div>
        </div>
        <div class="err" id="pwdErr"></div>
        <button class="btn" id="btnPwd" style="width:100%">登 录</button>
      </div>

      <!-- 短信 -->
      <div id="pane-sms" style="display:none">
        <label>手机号</label>
        <input id="smsPhone" placeholder="13800000001" />
        <label>短信验证码</label>
        <div class="captcha-row">
          <input id="smsCode" placeholder="4 位数字" />
          <button class="btn gray small" id="btnSendSms" style="white-space:nowrap">获取验证码</button>
        </div>
        <div class="err" id="smsErr"></div>
        <button class="btn" id="btnSms" style="width:100%">登 录</button>
      </div>

      <!-- 扫码 -->
      <div id="pane-qr" style="display:none">
        <div class="qr-box">
          <img id="qrImg" alt="二维码" />
          <div class="hint" id="qrHint">正在生成…</div>
        </div>
        <button class="btn gray small" id="btnQrRefresh" style="width:100%">刷新二维码</button>
      </div>

      <div class="hr"></div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="dim" style="font-size:12px">还没有账号？</span>
        <button class="btn gray small" id="btnReg">注册（需审批）</button>
      </div>

      <!-- 注册 -->
      <div id="pane-reg" style="display:none">
        <label>手机号</label>
        <input id="regPhone" placeholder="11 位手机号" />
        <label>短信验证码</label>
        <div class="captcha-row">
          <input id="regCode" placeholder="4 位数字" />
          <button class="btn gray small" id="btnRegSms" style="white-space:nowrap">获取验证码</button>
        </div>
        <label>姓名</label>
        <input id="regName" placeholder="真实姓名" />
        <label>登录账号</label>
        <input id="regUser" placeholder="自定义账号" />
        <label>密码（≥8 位）</label>
        <input id="regPwd" type="password" placeholder="至少 8 位" />
        <label>所属机构</label>
        <select id="regOrg"></select>
        <div class="err" id="regErr"></div>
        <button class="btn" id="btnRegSubmit" style="width:100%">提交注册申请</button>
      </div>
    </div>
  </div>
</div>

<script src="/app.js"></script>
<script>
let capSid = { value: '' };
let qrToken = '', qrTimer = null, qrPollTimer = null;

const $ = (id) => document.getElementById(id);
const show = (id) => ['pane-pwd', 'pane-sms', 'pane-qr', 'pane-reg'].forEach(p => $(p).style.display = p === id ? '' : 'none');

/* ---------------- 租户 ---------------- */
async function loadTenants() {
  const list = [
    { u: 'demo', n: '示范实验学校（demo）' },
    { u: 'district', n: '区域教育局版（district）' },
    { u: 'closed', n: '关闭注册的学校（closed）' },
  ];
  const sel = $('tenantSel');
  sel.innerHTML = list.map(t => `<option value="${t.u}">${t.n}</option>`).join('');
  await onTenantChange();
}
async function onTenantChange() {
  const un = $('tenantSel').value;
  const r = await api('/base/api/tenant/query', {}, { method: 'GET', query: { uniqueName: un }, encrypt: false });
  if (r.code !== 0) return toast(r.msg, 'err');
  Store.tenant = r.data.id;
  $('brandName').textContent = r.data.title || '智慧校园平台';
  window.__tenant = r.data;
  const rg = $('btnReg');
  rg.disabled = !r.data.registerEnable;
  rg.textContent = r.data.registerEnable ? '注册（需审批）' : '该租户未开放注册';
  await loadRegOrgs();
  if ($('pane-qr').style.display !== 'none') startQr();
}
async function loadRegOrgs() {
  // 机构下拉：注册前用公开的机构接口（这里用租户级根机构，真实系统由小程序/后台下发）
  const sel = $('regOrg');
  const roots = { demo: [['O100', '示范实验学校'], ['O101', '小学部'], ['O102', '初中部'], ['O103', '教务处']],
    district: [['O200', '市教育局'], ['O201', '第一中学'], ['O202', '第二小学']], closed: [['O300', '封闭注册学校']] };
  const key = $('tenantSel').value;
  sel.innerHTML = (roots[key] || []).map(o => `<option value="${o[0]}">${o[1]}</option>`).join('');
}

/* ---------------- 账号密码登录 ---------------- */
$('btnPwd').onclick = async () => {
  $('pwdErr').textContent = '';
  const body = {
    tenantId: Store.tenant, userName: $('userName').value.trim(), password: $('password').value,
    checkCode: $('checkCode').value.trim(), checkCodeSessionId: capSid.value,
  };
  const btn = $('btnPwd'); btn.disabled = true; btn.textContent = '登录中…';
  const r = await api('/base/api/auth/loginByUserPwdNoOrg', body);
  btn.disabled = false; btn.textContent = '登 录';
  if (r.code === 0 && r.data.operationType === 5) {
    Store.token = r.data.userToken.accessToken;
    toast('登录成功，正在进入…', 'ok');
    setTimeout(() => location.href = '/admin.html', 400);
    return;
  }
  $('pwdErr').textContent = r.msg || '登录失败';
  if (r.data && r.data.needCode) {
    $('capWrap').style.display = '';
    if (r.data.checkCodeImageData) { $('capImg').src = r.data.checkCodeImageData; capSid.value = r.data.checkCodeSessionId; }
    else loadCaptcha($('capImg'), capSid);
  }
};
$('capImg').onclick = () => loadCaptcha($('capImg'), capSid);

/* ---------------- 短信登录 ---------------- */
$('btnSendSms').onclick = async () => {
  const phone = $('smsPhone').value.trim();
  const r = await api('/base/api/auth/sms/code/send', { phone });
  if (r.code === 0) {
    toast('验证码已发送' + (r.data.devCode ? `（演示环境：${r.data.devCode}）` : ''), 'ok');
    if (r.data.devCode) $('smsCode').value = r.data.devCode;
  } else toast(r.msg, 'err');
};
$('btnSms').onclick = async () => {
  $('smsErr').textContent = '';
  const r = await api('/base/api/auth/loginByPhoneSms', {
    tenantId: Store.tenant, phone: $('smsPhone').value.trim(), smsCode: $('smsCode').value.trim(),
  });
  if (r.code === 0) { Store.token = r.data.userToken.accessToken; toast('登录成功', 'ok'); setTimeout(() => location.href = '/admin.html', 400); }
  else $('smsErr').textContent = r.msg;
};

/* ---------------- 扫码登录 ---------------- */
async function startQr() {
  clearTimeout(qrTimer); clearInterval(qrPollTimer);
  const r = await api('/base/api/auth/getLoginQrCode', { tenantId: Store.tenant }, { encrypt: false });
  if (r.code !== 0) return toast(r.msg, 'err');
  qrToken = r.data.onceToken;
  $('qrImg').src = r.data.qrCode;
  $('qrHint').innerHTML = `等待扫码…<br/><span class="mono">onceToken: ${qrToken.slice(0, 18)}…</span><br/>
    用手机打开 <a href="${r.data.scanUrl}" target="_blank">确认页</a>（需手机端已登录）`;
  // 过期自动刷新
  qrTimer = setTimeout(startQr, 118000);
  qrPollTimer = setInterval(async () => {
    const s = await api('/base/api/auth/getLoginStatus', { onceToken: qrToken }, { encrypt: false });
    if (s.code !== 0) return;
    if (s.data.state === 3 && s.data.userToken) {
      clearInterval(qrPollTimer); clearTimeout(qrTimer);
      Store.token = s.data.userToken.accessToken;
      $('qrHint').textContent = '扫码成功，正在进入…';
      setTimeout(() => location.href = '/admin.html', 400);
    } else if (s.data.over) {
      clearInterval(qrPollTimer);
      $('qrHint').textContent = '二维码已失效，正在刷新…';
      setTimeout(startQr, 800);
    }
  }, 2000);
}
$('btnQrRefresh').onclick = startQr;

/* ---------------- 注册 ---------------- */
$('btnReg').onclick = () => { const p = $('pane-reg'); const open = p.style.display === 'none'; p.style.display = open ? '' : 'none'; };
$('btnRegSms').onclick = async () => {
  const r = await api('/base/api/auth/sms/code/send', { phone: $('regPhone').value.trim() });
  if (r.code === 0) { toast('验证码已发送' + (r.data.devCode ? `（演示环境：${r.data.devCode}）` : ''), 'ok'); if (r.data.devCode) $('regCode').value = r.data.devCode; }
  else toast(r.msg, 'err');
};
$('btnRegSubmit').onclick = async () => {
  $('regErr').textContent = '';
  const r = await api('/base/api/auth/signUp/v2', {
    tenantId: Store.tenant, orgId: $('regOrg').value, phone: $('regPhone').value.trim(),
    smsCode: $('regCode').value.trim(), realName: $('regName').value.trim(),
    userName: $('regUser').value.trim(), password: $('regPwd').value,
  });
  if (r.code === 0) {
    toast(r.data.state === 2 ? `申请已提交，等待管理员审批（applyId ${r.data.applyId}）` : '注册成功，可直接登录', 'ok');
    $('pane-reg').style.display = 'none';
  } else $('regErr').textContent = r.msg;
};

/* ---------------- 切换 ---------------- */
['pwd', 'sms', 'qr'].forEach(k => {
  $('tab-' + k).onclick = () => {
    ['pwd', 'sms', 'qr'].forEach(x => $('tab-' + x).classList.toggle('on', x === k));
    show('pane-' + k);
    if (k === 'qr') startQr(); else { clearInterval(qrPollTimer); clearTimeout(qrTimer); }
  };
});
$('tenantSel').onchange = onTenantChange;

(async () => {
  await cryInit();
  await loadTenants();
  loadCaptcha($('capImg'), capSid).catch(() => {});
})();
</script>
</body>
</html>
