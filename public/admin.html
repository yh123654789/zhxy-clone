<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>智慧校园平台 · 管理后台</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand"><i></i> 智慧校园</div>
    <nav id="nav"></nav>
    <div class="who">
      <div id="whoName">—</div>
      <div id="whoOrg" class="dim"></div>
      <div id="whoRole" style="margin-top:6px"></div>
      <button class="btn gray small" style="margin-top:10px;width:100%" onclick="logout()">退出登录</button>
    </div>
  </aside>

  <main class="main">
    <div class="head">
      <h2 id="pageTitle">概览</h2>
      <div id="pageActions"></div>
    </div>
    <div id="view"></div>
  </main>
</div>

<script src="/app.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let ME = null;

const PAGES = [
  { key: 'home', title: '概览', perm: null },
  { key: 'student', title: '学生管理', perm: 'base_student' },
  { key: 'teacher', title: '教师管理', perm: 'base_teacher' },
  { key: 'klass', title: '班级管理', perm: 'base_class' },
  { key: 'score', title: '成绩管理', perm: 'base_score' },
  { key: 'notice', title: '通知公告', perm: 'base_notice' },
  { key: 'leave', title: '请假审批', perm: 'base_leave' },
  { key: 'org', title: '机构树', perm: 'base_org' },
  { key: 'apply', title: '注册审批', perm: 'sys_apply' },
  { key: 'audit', title: '审计日志', perm: 'sys_audit' },
  { key: 'swap', title: '一次性 Token', perm: null },
];

const CAN = (p) => {
  if (!p) return true;
  const pages = (ME && ME.permissions.pages) || [];
  return pages.includes('*') || pages.includes(p);
};
const CANBTN = (b) => {
  const btns = (ME && ME.permissions.btns) || [];
  return btns.includes('*') || btns.includes(b);
};

async function boot() {
  // 演示便利：/admin.html?token=xxx 直接带入会话（生产环境应删掉这段）
  const q = new URLSearchParams(location.search);
  if (q.get('token')) { Store.token = q.get('token'); history.replaceState(null, '', '/admin.html' + (location.hash || '')); }
  if (!Store.token) return location.href = '/';
  const r = await api('/base/api/auth/user/current/detail', {}, { method: 'GET' });
  if (r.code !== 0) { Store.token = ''; return location.href = '/'; }
  ME = r.data;
  $('whoName').textContent = `${ME.realName}（${ME.userName}）`;
  $('whoOrg').textContent = `${ME.orgName} · ${ME.tenantId}`;
  $('whoRole').innerHTML = `<span class="tag ok">${ME.roleName}</span>`;
  const nav = $('nav');
  nav.innerHTML = PAGES.filter(p => CAN(p.perm))
    .map(p => `<a href="#${p.key}" data-k="${p.key}">${p.title}</a>`).join('');
  nav.onclick = (e) => { const a = e.target.closest('a'); if (a) { location.hash = '#' + a.dataset.k; } };
  window.addEventListener('hashchange', route);
  route();
}

function route() {
  const key = (location.hash || '#home').slice(1);
  const page = PAGES.find(p => p.key === key) || PAGES[0];
  if (!CAN(page.perm)) { toast('暂无该页面权限', 'err'); return location.hash = '#home'; }
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.k === page.key));
  $('pageTitle').textContent = page.title;
  $('pageActions').innerHTML = '';
  const fn = ({ home: viewHome, student: viewStudent, teacher: viewTeacher, klass: viewKlass,
     score: viewScore, notice: viewNotice, leave: viewLeave, ai: viewAi,
     org: viewOrg, apply: viewApply, audit: viewAudit, swap: viewSwap })[page.key];
  fn();
  if (page.key === 'home') setTimeout(renderHomeCharts, 80);
}

/* ---------------- 概览 ---------------- */
async function viewHome() {
  const s = await api('/base/api/student/page', { pageIndex: 1, pageSize: 100 });
  const t = await api('/base/api/teacher/page', { pageIndex: 1, pageSize: 100 });
  const c = await api('/base/api/class/page', { pageIndex: 1, pageSize: 100 });
  const a = CAN('sys_apply') ? await api('/base/api/auth/register/apply/page', { pageIndex: 1, pageSize: 100 }) : { data: { total: '-' } };
  $('view').innerHTML = `
    <div class="grid2">
      <div class="stat"><b>${s.data ? s.data.total : '-'}</b><span>学生总数（数据域内）</span></div>
      <div class="stat"><b>${t.data ? t.data.total : '-'}</b><span>教师总数</span></div>
      <div class="stat"><b>${c.data ? c.data.total : '-'}</b><span>班级总数</span></div>
      <div class="stat"><b>${a.data ? a.data.total : '-'}</b><span>待处理注册申请</span></div>
    </div>
    <div class="card" style="margin-top:16px">
      <div style="font-weight:700;margin-bottom:10px">当前权限</div>
      <div class="dim" style="font-size:13px;line-height:2">
        页面权限码：${ME.permissions.pages.map(p=>`<span class="tag ok" style="margin:2px 4px 2px 0">${p}</span>`).join('') || '<span class="dim">（无）</span>'}<br/>
        按钮权限码：${ME.permissions.btns.map(p=>`<span class="tag" style="margin:2px 4px 2px 0">${p}</span>`).join('') || '<span class="dim">（无）</span>'}<br/>
        <span style="color:var(--warn)">提示：按钮权限只影响前端是否渲染，服务端每个写接口都会独立校验 —— 直接构造请求也会被拒。</span>
      </div>
    </div>`;
}

/* ---------------- 通用表格 ---------------- */
function table(cols, rows, actions) {
  return `<table><thead><tr>${cols.map(c => `<th>${c.title}</th>`).join('')}${actions ? '<th>操作</th>' : ''}</tr></thead>
    <tbody>${rows.length ? rows.map(r => `<tr>${cols.map(c => `<td>${r[c.key] ?? ''}</td>`).join('')}
      ${actions ? `<td>${actions(r)}</td>` : ''}</tr>`).join('')
      : `<tr><td colspan="${cols.length + (actions ? 1 : 0)}" class="dim">暂无数据</td></tr>`}</tbody></table>`;
}

let pg = { student: 1, teacher: 1, klass: 1 };

async function viewStudent() {
  $('pageActions').innerHTML = CANBTN('base_student_insert')
    ? `<button class="btn small" onclick="addStudent()">新增学生</button>` : '';
  const r = await api('/base/api/student/page', { pageIndex: pg.student, pageSize: 8 });
  if (r.code !== 0) return $('view').innerHTML = `<div class="card">${r.msg}</div>`;
  $('view').innerHTML = `<div class="card">${table(
    [{ key: 'id', title: 'ID' }, { key: 'name', title: '姓名' }, { key: 'studentNo', title: '学号' },
     { key: 'gender', title: '性别' }, { key: 'orgId', title: '机构' }, { key: 'phone', title: '手机号' }],
    r.data.list)}${pager(r.data, 'student', viewStudent)}</div>`;
}

async function addStudent() {
  const name = prompt('学生姓名'); if (!name) return;
  const orgId = prompt('机构ID（可填 O104/O105/O106；跨机构会被服务端拒绝）', 'O104'); if (!orgId) return;
  const r = await api('/base/api/student/save', { name, orgId });
  toast(r.code === 0 ? '新增成功' : r.msg, r.code === 0 ? 'ok' : 'err');
  viewStudent();
}

async function viewTeacher() {
  const r = await api('/base/api/teacher/page', { pageIndex: pg.teacher, pageSize: 8 });
  if (r.code !== 0) return $('view').innerHTML = `<div class="card">${r.msg}</div>`;
  $('view').innerHTML = `<div class="card">${table(
    [{ key: 'id', title: 'ID' }, { key: 'name', title: '姓名' }, { key: 'subject', title: '学科' },
     { key: 'orgId', title: '机构' }, { key: 'phone', title: '手机号' }],
    r.data.list)}${pager(r.data, 'teacher', viewTeacher)}</div>`;
}

async function viewKlass() {
  const r = await api('/base/api/class/page', { pageIndex: pg.klass, pageSize: 8 });
  if (r.code !== 0) return $('view').innerHTML = `<div class="card">${r.msg}</div>`;
  $('view').innerHTML = `<div class="card">${table(
    [{ key: 'name', title: '班级' }, { key: 'headTeacher', title: '班主任' },
     { key: 'count', title: '人数' }, { key: 'orgId', title: '机构' }],
    r.data.list)}${pager(r.data, 'klass', viewKlass)}</div>`;
}

function pager(d, key, fn) {
  const max = Math.max(1, Math.ceil(d.total / d.pageSize));
  return `<div class="pager">共 ${d.total} 条 · 第 ${d.pageIndex}/${max} 页
    <button class="btn gray small" onclick="goPage('${key}',-1,${fn.name})">上一页</button>
    <button class="btn gray small" onclick="goPage('${key}',1,${fn.name})">下一页</button></div>`;
}
window.__fns = { viewStudent, viewTeacher, viewKlass };
function goPage(key, delta, fnName) { pg[key] = Math.max(1, pg[key] + delta); window.__fns[fnName](); }

/* ---------------- 机构树 ---------------- */
async function viewOrg() {
  const root = await api('/base/api/organizationUnit/all', {}, { method: 'GET', query: { parentId: '0' } });
  if (root.code !== 0) return $('view').innerHTML = `<div class="card">${root.msg}</div>`;
  const rows = [];
  async function walk(list, depth) {
    for (const o of list) {
      rows.push({ ...o, indent: '　'.repeat(depth) + (depth ? '└ ' : '') });
      const kids = await api('/base/api/organizationUnit/all', {}, { method: 'GET', query: { parentId: o.id } });
      if (kids.code === 0 && kids.data.length) await walk(kids.data, depth + 1);
    }
  }
  await walk(root.data, 0);
  $('view').innerHTML = `<div class="card">${table(
    [{ key: 'indent', title: '机构' }, { key: 'id', title: 'ID' }, { key: 'unitAttr', title: '类型码' },
     { key: 'level', title: '层级' }, { key: 'path', title: '路径' }],
    rows.map(r => ({ ...r, indent: r.indent + r.displayName })))}</div>`;
}

/* ---------------- 注册审批 ---------------- */
async function viewApply() {
  const r = await api('/base/api/auth/register/apply/page', { pageIndex: 1, pageSize: 20 });
  if (r.code !== 0) return $('view').innerHTML = `<div class="card">${r.msg}</div>`;
  const stateTag = (s) => s === 0 ? '<span class="tag warn">待审核</span>'
    : s === 1 ? '<span class="tag ok">已通过</span>' : '<span class="tag err">已驳回</span>';
  $('view').innerHTML = `<div class="card">${table(
    [{ key: 'id', title: '申请ID' }, { key: 'userName', title: '账号' }, { key: 'realName', title: '姓名' },
     { key: 'phone', title: '手机号' }, { key: 'orgId', title: '机构' }, { key: 'stateTxt', title: '状态' }],
    r.data.list.map(a => ({ ...a, stateTxt: stateTag(a.state) })),
    (row) => row.state === 0
      ? `<button class="btn small" onclick="doApply('${row.id}',1)">通过</button>
         <button class="btn small danger" onclick="doApply('${row.id}',0)">驳回</button>`
      : '<span class="dim">—</span>')}</div>`;
}
async function doApply(applyId, pass) {
  const r = await api('/base/api/auth/register/apply', { applyId, pass: !!pass, remark: pass ? '' : '资料不全' });
  toast(r.code === 0 ? (pass ? '已通过，账号已创建' : '已驳回') : r.msg, r.code === 0 ? 'ok' : 'err');
  viewApply();
}

/* ---------------- 审计日志 ---------------- */
async function viewAudit() {
  const r = await api('/base/api/audit/page', {}, { method: 'GET', query: { pageIndex: 1, pageSize: 30 } });
  if (r.code !== 0) return $('view').innerHTML = `<div class="card">${r.msg}</div>`;
  const t = (ts) => new Date(ts).toLocaleString('zh-CN');
  $('view').innerHTML = `<div class="card">${table(
    [{ key: 'tsTxt', title: '时间' }, { key: 'user_name', title: '操作人' }, { key: 'method', title: '方法' },
     { key: 'path', title: '路径' }, { key: 'ip', title: 'IP' }, { key: 'detail', title: '详情' }],
    r.data.list.map(x => ({ ...x, tsTxt: t(x.ts) })))}</div>`;
}

/* ---------------- 一次性 token 演示 ---------------- */
async function viewSwap() {
  $('view').innerHTML = `<div class="card">
    <div style="font-weight:700">跨系统单点登录（一次性 Token）</div>
    <div class="dim" style="margin:10px 0 16px;font-size:13px;line-height:1.9">
      1. 本系统用当前会话换取一次性 token（60 秒有效、用一次即失效）<br/>
      2. 把 token 拼到目标系统 URL：<span class="mono">?accesstoken=xxx</span>（本实现放在 header 更安全）<br/>
      3. 目标系统用 token 兑换自己的会话，兑换后立即失效
    </div>
    <button class="btn small" onclick="makeOnce()">生成一次性 Token</button>
    <button class="btn gray small" onclick="useOnce()">模拟目标系统兑换</button>
    <div id="swapOut" class="mono" style="margin-top:14px;color:var(--dim)"></div></div>`;
}
let lastOnce = '';
async function makeOnce() {
  const r = await api('/base/api/auth/swap/once/token', {});
  if (r.code !== 0) return toast(r.msg, 'err');
  lastOnce = r.data.accessToken;
  $('swapOut').innerHTML = `已生成：<span style="color:var(--ok)">${lastOnce}</span><br/>60 秒内有效，只能用一次。`;
}
async function useOnce() {
  if (!lastOnce) return toast('先生成 token', 'err');
  const r = await api('/base/api/auth/swap/token/byonce', {}, { method: 'GET', query: { oncetoken: lastOnce } });
  $('swapOut').innerHTML += `<br/>第一次兑换：${r.code === 0 ? '成功（已签发新会话）' : r.msg}`;
  const r2 = await api('/base/api/auth/swap/token/byonce', {}, { method: 'GET', query: { oncetoken: lastOnce } });
  $('swapOut').innerHTML += `<br/>第二次兑换：<span style="color:var(--danger)">${r2.code === 0 ? '竟然还成功？' : r2.msg + '（符合预期：一次性）'}</span>`;
}

/* ---------------- 成绩管理 ---------------- */
let scoreFilter = { subject: '', className: '', keyword: '' };
async function viewScore() {
  $('pageActions').innerHTML = CANBTN('base_score_insert')
    ? `<button class="btn small" onclick="addScore()">录入成绩</button>` : '';
  const r = await api('/base/api/score/page', { pageIndex: 1, pageSize: 10, ...scoreFilter });
  if (r.code !== 0) return $('view').innerHTML = `<div class="card">${r.msg}</div>`;
  const st = r.data.stat;
  const bar = st.bySubject.map(s => `
    <div style="margin:8px 0">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--dim)">
        <span>${s.subject}</span><span>均分 ${s.avg} · 及格率 ${s.passRate}% · ${s.count} 人</span>
      </div>
      <div style="height:8px;background:#0e1a2b;border-radius:99px;overflow:hidden;margin-top:4px">
        <div style="height:100%;width:${s.avg}%;background:linear-gradient(90deg,var(--brand2),var(--brand))"></div>
      </div>
    </div>`).join('');
  $('view').innerHTML = `
    <div class="grid2" style="margin-bottom:14px">
      <div class="stat"><b>${st.total}</b><span>成绩条数（当前筛选）</span></div>
      <div class="stat"><b>${st.avg}</b><span>平均分</span></div>
      <div class="stat"><b>${st.passRate}%</b><span>及格率（≥60）</span></div>
      <div class="stat"><b>${st.bySubject.length}</b><span>涉及学科</span></div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div style="font-weight:700;margin-bottom:6px">分学科概览</div>${bar || '<div class="dim">无数据</div>'}
    </div>
    <div class="card">
      <div class="toolbar">
        <select onchange="scoreFilter.subject=this.value;viewScore()" style="max-width:130px">
          <option value="">全部学科</option>
          ${['语文', '数学', '英语'].map(s => `<option ${scoreFilter.subject === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
        <select onchange="scoreFilter.className=this.value;viewScore()" style="max-width:150px">
          <option value="">全部班级</option>
          ${['五年级1班', '五年级2班', '六年级1班', '初一1班'].map(c => `<option ${scoreFilter.className === c ? 'selected' : ''}>${c}</option>`).join('')}
        </select>
        <input id="scoreKw" placeholder="学生姓名/学号" value="${scoreFilter.keyword}"
               onkeydown="if(event.key==='Enter'){scoreFilter.keyword=this.value;viewScore()}" />
        <button class="btn gray small" onclick="scoreFilter.keyword=document.getElementById('scoreKw').value;viewScore()">查询</button>
      </div>
      ${table([{ key: 'studentNo', title: '学号' }, { key: 'studentName', title: '姓名' },
        { key: 'className', title: '班级' }, { key: 'subject', title: '学科' },
        { key: 'scoreTxt', title: '分数' }, { key: 'levelTxt', title: '等级' }],
        r.data.list.map(x => ({
          ...x, scoreTxt: x.score,
          levelTxt: x.score >= 90 ? '<span class="tag ok">优秀</span>'
            : x.score >= 60 ? '<span class="tag">及格</span>' : '<span class="tag err">不及格</span>',
        })))}
      ${pager(r.data, 'score', viewScore)}
    </div>`;
}
async function addScore() {
  const studentId = prompt('学生 ID（如 S101）'); if (!studentId) return;
  const subject = prompt('学科（语文/数学/英语）', '数学'); if (!subject) return;
  const score = prompt('分数（0~100）', '88'); if (score === null) return;
  const r = await api('/base/api/score/save', { studentId, subject, score: Number(score) });
  toast(r.code === 0 ? '成绩已保存' : r.msg, r.code === 0 ? 'ok' : 'err');
  viewScore();
}

/* ---------------- 通知公告 ---------------- */
async function viewNotice() {
  $('pageActions').innerHTML = CANBTN('base_notice_publish')
    ? `<button class="btn small" onclick="publishNotice()">发布通知</button>` : '';
  const r = await api('/base/api/notice/page', { pageIndex: 1, pageSize: 8 });
  if (r.code !== 0) return $('view').innerHTML = `<div class="card">${r.msg}</div>`;
  const list = r.data.list.map(n => `
    <div class="notice-item" onclick="readNotice('${n.id}')">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
        <div>${n.top ? '<span class="tag err" style="margin-right:6px">置顶</span>' : ''}<b>${n.title}</b></div>
        <span class="dim" style="font-size:12px;white-space:nowrap">${new Date(n.createdAt).toLocaleDateString('zh-CN')}</span>
      </div>
      <div class="dim" style="font-size:12.5px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n.content}</div>
      <div class="dim" style="font-size:11.5px;margin-top:6px">${n.author} · 阅读 ${n.readCount}</div>
    </div>`).join('');
  $('view').innerHTML = `<div class="card">${list || '<div class="dim">暂无通知</div>'}
      <div class="pager">共 ${r.data.total} 条</div></div>
    <div class="card" id="noticeDetail" style="display:none;margin-top:14px"></div>`;
}
async function readNotice(id) {
  const r = await api('/base/api/notice/detail', {}, { method: 'GET', query: { id } });
  if (r.code !== 0) return toast(r.msg, 'err');
  const n = r.data, el = $('noticeDetail');
  el.style.display = '';
  el.innerHTML = `<div style="display:flex;justify-content:space-between">
      <h3 style="margin:0 0 6px">${n.title}</h3>
      <span class="dim" style="font-size:12px">${n.author} · ${new Date(n.createdAt).toLocaleString('zh-CN')}</span>
    </div><div class="hr"></div><div style="line-height:2;font-size:13.5px">${n.content}</div>`;
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
async function publishNotice() {
  const title = prompt('通知标题'); if (!title) return;
  const content = prompt('通知正文'); if (!content) return;
  const r = await api('/base/api/notice/save', { title, content, top: false });
  toast(r.code === 0 ? '已发布' : r.msg, r.code === 0 ? 'ok' : 'err');
  viewNotice();
}

/* ---------------- 请假审批 ---------------- */
let leaveState = '';
async function viewLeave() {
  const r = await api('/base/api/leave/page', { pageIndex: 1, pageSize: 10, state: leaveState });
  if (r.code !== 0) return $('view').innerHTML = `<div class="card">${r.msg}</div>`;
  const st = r.data.stat;
  const stateTag = (s) => s === 0 ? '<span class="tag warn">待审批</span>'
    : s === 1 ? '<span class="tag ok">已通过</span>' : '<span class="tag err">已驳回</span>';
  $('view').innerHTML = `
    <div class="grid2" style="margin-bottom:14px">
      <div class="stat"><b>${st.pending}</b><span>待审批</span></div>
      <div class="stat"><b>${st.passed}</b><span>已通过</span></div>
      <div class="stat"><b>${st.refused}</b><span>已驳回</span></div>
    </div>
    <div class="card">
      <div class="toolbar">
        ${[['', '全部'], ['0', '待审批'], ['1', '已通过'], ['2', '已驳回']].map(([v, t]) =>
          `<button class="btn ${leaveState === v ? '' : 'gray'} small" onclick="leaveState='${v}';viewLeave()">${t}</button>`).join('')}
      </div>
      ${table([{ key: 'studentName', title: '学生' }, { key: 'className', title: '班级' },
        { key: 'reason', title: '事由' }, { key: 'daysTxt', title: '天数' },
        { key: 'stateTxt', title: '状态' }, { key: 'approver', title: '审批人' }],
        r.data.list.map(x => ({ ...x, daysTxt: x.days + ' 天', stateTxt: stateTag(x.state) })),
        (row) => row.state === 0 && CANBTN('base_leave_approve')
          ? `<button class="btn small" onclick="doLeave('${row.id}',1)">通过</button>
             <button class="btn small danger" onclick="doLeave('${row.id}',0)">驳回</button>`
          : '<span class="dim">—</span>')}
      ${pager(r.data, 'leave', viewLeave)}
    </div>`;
}
async function doLeave(leaveId, pass) {
  const r = await api('/base/api/leave/approve', { leaveId, pass: !!pass, remark: pass ? '' : '事由不充分' });
  toast(r.code === 0 ? (pass ? '已通过' : '已驳回') : r.msg, r.code === 0 ? 'ok' : 'err');
  viewLeave();
}

/* ---------------- AI 助手 ---------------- */
let aiMsgs = [{ role: 'assistant', content: '你好，我是智慧校园平台的智能助手。可以问我：怎么登录、扫码怎么用、为什么看不到某些菜单、成绩怎么录、请假怎么审批、一次性 Token 是什么。' }];
let aiBusy = false;
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

async function viewAi() {
  $('pageActions').innerHTML = `<button class="btn gray small" onclick="aiMsgs=aiMsgs.slice(0,1);viewAi()">清空对话</button>`;
  $('view').innerHTML = `
    <div class="card chat-card">
      <div class="chat-head"><span>智能助手</span><span class="dim" id="aiMode" style="font-size:12px">后端探测中…</span></div>
      <div class="chat-body" id="chatBody"></div>
      <div class="chat-input">
        <input id="aiInput" placeholder="问点什么…（Enter 发送）"
               onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();aiSend()}" />
        <button class="btn" id="aiBtn" onclick="aiSend()">发送</button>
      </div>
      <div class="dim" style="font-size:11.5px;margin-top:8px">
        服务端代理转发，密钥不下发浏览器；优先云端 API，未配置则自动用本机 Ollama，都没有时给离线答案。
      </div>
    </div>`;
  renderChat();
}
function renderChat() {
  const box = $('chatBody'); if (!box) return;
  box.innerHTML = aiMsgs.map(m => `
    <div class="msg ${m.role}">
      <div class="avatar">${m.role === 'user' ? '我' : 'AI'}</div>
      <div class="bubble">${escapeHtml(m.content).replace(/\n/g, '<br/>')}</div>
    </div>`).join('');
  box.scrollTop = box.scrollHeight;
}
async function aiSend() {
  if (aiBusy) return;
  const input = $('aiInput'), q = (input.value || '').trim();
  if (!q) return;
  input.value = '';
  aiMsgs.push({ role: 'user', content: q });
  aiMsgs.push({ role: 'assistant', content: '' });
  renderChat();
  aiBusy = true; $('aiBtn').disabled = true;
  try {
    const e = await encryptBody({ messages: aiMsgs.filter(m => m.content).slice(-10) });
    const res = await fetch('/base/api/ai/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...e.headers, Authorization: 'Bearer ' + Store.token },
      body: JSON.stringify(e.body),
    });
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('text/event-stream')) {
      $('aiMode').textContent = `后端：${res.headers.get('x-ai-mode')} / ${res.headers.get('x-ai-model')}`;
      const reader = res.body.getReader(), dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          const line = chunk.split('\n').find(l => l.startsWith('data:'));
          if (!line) continue;
          const data = line.slice(5).trim();
          if (data === '[DONE]') continue;
          try {
            const j = JSON.parse(data);
            if (j.delta) { aiMsgs[aiMsgs.length - 1].content += j.delta; renderChat(); }
            if (j.error) { aiMsgs[aiMsgs.length - 1].content += '\n[错误] ' + j.error; renderChat(); }
          } catch { }
        }
      }
    } else {
      const j = await res.json();
      if (j.code === 0 && j.data) {
        aiMsgs[aiMsgs.length - 1].content = j.data.answer;
        $('aiMode').textContent = `后端：${j.data.mode}${j.data.model ? ' / ' + j.data.model : ''}`;
      } else aiMsgs[aiMsgs.length - 1].content = j.msg || '请求失败';
      renderChat();
    }
  } catch (err) {
    aiMsgs[aiMsgs.length - 1].content = '调用失败：' + err.message;
    renderChat();
  } finally {
    aiBusy = false; $('aiBtn').disabled = false;
    if (!aiMsgs[aiMsgs.length - 1].content) aiMsgs[aiMsgs.length - 1].content = '（无输出）';
    renderChat();
  }
}

/* ---------------- 首页图表（纯 SVG，无依赖） ---------------- */
async function renderHomeCharts() {
  const view = document.getElementById('view');
  if (!view) return;
  if (document.getElementById('homeCharts')) return;

  const wrap = document.createElement('div');
  wrap.id = 'homeCharts';
  wrap.style.marginTop = '16px';
  wrap.innerHTML = '<div class="card"><div class="dim">图表加载中…</div></div>';
  view.appendChild(wrap);

  const sc = await api('/base/api/score/page', { pageIndex: 1, pageSize: 1 });
  const lv = await api('/base/api/leave/page', { pageIndex: 1, pageSize: 1 });
  const nd = await api('/base/api/notice/page', { pageIndex: 1, pageSize: 1 });

  const subj = (sc.code === 0 && sc.data.stat) ? sc.data.stat.bySubject : [];
  const lst = (lv.code === 0 && lv.data.stat) ? lv.data.stat : { pending: 0, passed: 0, refused: 0 };

  // 柱状图：学科平均分
  const W = 340, H = 150, pad = 26;
  const maxV = 100;
  const bw = subj.length ? Math.min(58, (W - pad * 2) / subj.length - 16) : 40;
  const bars = subj.map((s, i) => {
    const x = pad + i * ((W - pad * 2) / Math.max(1, subj.length)) + 8;
    const h = Math.round((s.avg / maxV) * (H - 46));
    const y = H - 26 - h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="url(#g1)"/>
      <text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" font-size="11" fill="#cfe8e2">${s.avg}</text>
      <text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle" font-size="10" fill="#7d97ad">${s.subject}</text>`;
  }).join('');

  // 环形图：请假状态
  const total = lst.pending + lst.passed + lst.refused || 1;
  const segs = [
    { v: lst.pending, c: '#e0a33e', t: '待审' },
    { v: lst.passed, c: '#35c07a', t: '通过' },
    { v: lst.refused, c: '#e2574c', t: '驳回' },
  ];
  let acc = 0; const R = 44, C = 2 * Math.PI * R;
  const arcs = segs.map(s => {
    const len = (s.v / total) * C;
    const el = `<circle cx="66" cy="66" r="${R}" fill="none" stroke="${s.c}" stroke-width="14"
      stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-acc}" transform="rotate(-90 66 66)" opacity=".9"/>`;
    acc += len; return el;
  }).join('');
  const legend = segs.map(s => `<div style="display:flex;align-items:center;gap:7px;font-size:12px;margin:4px 0">
      <i style="width:9px;height:9px;border-radius:3px;background:${s.c};display:inline-block"></i>
      <span class="dim">${s.t}</span><b style="margin-left:auto">${s.v}</b></div>`).join('');

  wrap.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div class="card">
        <div style="font-weight:700;margin-bottom:4px">学科平均分</div>
        <div class="dim" style="font-size:12px;margin-bottom:6px">共 ${(sc.code === 0 && sc.data.stat) ? sc.data.stat.total : 0} 条成绩</div>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
          <defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4fd1c5"/><stop offset="100%" stop-color="#2f9e8f" stop-opacity=".55"/>
          </linearGradient></defs>
          <line x1="${pad - 6}" y1="${H - 26}" x2="${W - pad + 6}" y2="${H - 26}" stroke="#27405f"/>
          ${bars || '<text x="' + W / 2 + '" y="' + H / 2 + '" text-anchor="middle" fill="#7d97ad" font-size="12">无数据</text>'}
        </svg>
      </div>
      <div class="card" style="display:flex;flex-direction:column;justify-content:center;height:100%">
        <div style="font-weight:700;margin-bottom:4px">请假审批分布</div>
        <div class="dim" style="font-size:12px;margin-bottom:6px">共 ${total} 条申请</div>
        <div style="display:flex;align-items:center;gap:18px">
          <svg viewBox="0 0 132 132" style="width:118px;height:118px;flex:none">
            <circle cx="66" cy="66" r="${R}" fill="none" stroke="#1b2c44" stroke-width="14"/>
            ${arcs}
            <text x="66" y="64" text-anchor="middle" font-size="18" fill="#e8f0f8" font-weight="700">${total}</text>
            <text x="66" y="82" text-anchor="middle" font-size="10" fill="#7d97ad">申请</text>
          </svg>
          <div style="flex:1">${legend}</div>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:14px;display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-weight:700">通知公告</div>
        <div class="dim" style="font-size:12px">当前租户共 ${nd.code === 0 ? nd.data.total : 0} 条，最新一条在「通知公告」页查看</div>
      </div>
      <button class="btn gray small" onclick="location.hash='#notice'">去查看</button>
    </div>`;
}

function logout() {
  api('/base/api/auth/logout', {}).finally(() => { Store.token = ''; location.href = '/'; });
}

boot();
